# KEYBINDS {{{

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0

map option+h send_text all \x1bh

map ctrl+tab send_text all \x1b[1;5I
map ctrl+shift+tab send_text all \x1b[1;6I

map ctrl+1 send_text all \x1b1
map ctrl+2 send_text all \x1b2
map ctrl+3 send_text all \x1b3
map ctrl+4 send_text all \x1b4
map ctrl+5 send_text all \x1b5
map ctrl+6 send_text all \x1b6
map ctrl+7 send_text all \x1b7
map ctrl+8 send_text all \x1b8
map ctrl+9 send_text all \x1b9

map ctrl+7 set_colors ~/.config/kitty/colors/century.white.conf
map ctrl+8 set_colors ~/.config/kitty/colors/century.light.conf
map ctrl+9 set_colors ~/.config/kitty/colors/century.medium.conf
map ctrl+0 set_colors ~/.config/kitty/colors/century.dark.conf
map ctrl+minus set_colors ~/.config/kitty/colors/century.black.conf

map ctrl+shift+r load_config_file
map cmd+shift+r load_config_file

# }}}

# cursor_trail 1
cursor_trail 0
cursor_trail_start_threshold 20
cursor_trail_decay 0.05 0.2

