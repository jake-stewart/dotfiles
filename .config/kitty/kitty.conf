# FONT {{{

font_size 17.0

disable_ligatures always

font_family      Iosevka Custom Regular
italic_font      Iosevka Custom Italic
bold_font        Iosevka Custom Bold
bold_italic_font Iosevka Custom Bold Italic

# }}}
# SETTINGS {{{
# cursor_text_color background
shell_integration disabled
strip_trailing_spaces smart
enable_audio_bell no
visual_bell_duration 0.0
clear_all_shortcuts yes
confirm_os_window_close 0
detect_urls no
window_padding_width 9
# window_padding_width 0
# hide_window_decorations yes
placement_strategy center
default_pointer_shape arrow
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
macos_show_window_title_in none
macos_titlebar_color background
allow_remote_control socket
listen_on unix:/tmp/kitty-sock
# background_opacity 0.9

# }}}
# COLOR PALETTE {{{

# include ~/.config/kitty/colors/century.dark.conf

palette_generate fixed

